
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      PORT: 8000
    ports:
      - "8001:8000"
    volumes:
      - agent15_data:/app/data

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      AGENT15_API_URL: http://backend:8000
      PORT: 8501
    ports:
      - "8503:8501"
    depends_on:
      - backend

volumes:
  agent15_data:
